name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run luacheck
        uses: nebularg/actions-luacheck@v1
        with:
          args: --no-color -q
          files: src
